[project]
name = "matura"
version = "0.1.0"
description = "Matura SDK for Python: verify Matura tokens, check permissions, keep the matura_* contract tables in sync"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.30"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "fastapi>=0.110",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matura"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
