  # --- internal (Keycloak) ----------------------------------------------------------------------------------------
  /internal/v1/token-context:
    post:
      operationId: getTokenContext
      summary: Token claims for Keycloak's mapper
      description: |
        The tenant, workspace, roles and permissions to put in an access token. Records the user's profile.
        A refusal is 403 with an OAuth error the mapper passes on. Served only when `MATURA_INTERNAL_TOKEN` is set.
      tags: [internal]
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, client_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                email:
                  type: string
                email_verified:
                  type: boolean
                name:
                  type: string
                locale:
                  type: string
                client_id:
                  type: string
                tenant:
                  type: string
                  description: Tenant slug or id; empty means the tenant used last, else the first one.
                workspace:
                  type: string
                  description: Workspace id; empty means the tenant's default workspace.
      responses:
        '200':
          description: The claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No token may be issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefusal'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC access token from Keycloak. Endpoints under `/admin/v1` need the operator realm role (403 otherwise).
        A deactivated account answers 403.
    appBasic:
      type: http
      scheme: basic
      description: An app's client id and secret (see `/admin/v1/apps/{slug}/secrets`).
    internalToken:
      type: http
      scheme: bearer
      description: The shared `MATURA_INTERNAL_TOKEN`.

  parameters:
    tid:
      name: tid
      in: path
      required: true
      description: Tenant id.
      schema:
        type: string
        format: uuid
    wid:
      name: wid
      in: path
      required: true
      description: Workspace id.
      schema:
        type: string
        format: uuid
    uid:
      name: uid
      in: path
      required: true
      description: User id.
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    app:
      name: app
      in: path
      required: true
      description: App slug.
      schema:
        type: string
    slug:
      name: slug
      in: path
      required: true
      description: App slug.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Makes the POST safe to retry for 24 hours. A retry with the same key and body gets the stored response with
        `Idempotency-Replayed: true`; one sent while the first is still running answers 409.
      schema:
        type: string
        maxLength: 255
    auditTenant:
      name: tenant
      in: query
      description: A tenant id, or `installation` for events with no tenant.
      schema:
        type: string
    auditActor:
      name: actor
      in: query
      description: Only events by this user or app id, or this email address.
      schema:
        type: string
    auditAction:
      name: action
      in: query
      description: Only actions starting with this, e.g. `membership.` or `invitation.created`.
      schema:
        type: string
    auditFrom:
      name: from
      in: query
      description: Only events at or after this time (RFC 3339).
      schema:
        type: string
        format: date-time
    auditTo:
      name: to
      in: query
      description: Only events before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    auditCursor:
      name: cursor
      in: query
      description: '`next_cursor` from the previous page.'
      schema:
        type: string
    auditLimit:
      name: limit
      in: query
      description: Page size; 100 by default, at most 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    IfMatch:
      name: If-Match
      in: header
      description: The version from the `ETag`; the change is refused with 412 if the resource changed since.
      schema:
        type: string

  headers:
    ETag:
      description: The resource's version, quoted.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, unknown field, bad query parameter or header).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (role, operator-only endpoint, or deactivated account).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or in a tenant the caller is not a member of.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with the current state (duplicate, wrong state, or an idempotent request still running).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The resource changed since the version in `If-Match`; reload and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: No longer available (invitation used, revoked or expired; or change-feed cursor expired).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Well-formed but invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotReady:
      description: The database is unreachable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://matura.dev/problems/not-found']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    DataMode:
      type: string
      enum: [shared, schema, database]
    TenantRole:
      type: string
      enum: [owner, admin, billing, member]
      default: member
    SSLMode:
      type: string
      enum: [disable, allow, prefer, require, verify-ca, verify-full]

    User:
      type: object
      required: [id, email, email_verified, display_name, locale, kind, status, version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
        email_verified:
          type: boolean
        display_name:
          type: [string, 'null']
        locale:
          type: [string, 'null']
        kind:
          type: string
          enum: [human, service, agent]
        status:
          type: string
          enum: [active, deactivated, deleted]
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Tenant:
      type: object
      required: [id, slug, name, kind, status, plan, data_mode_default, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [company, shared, personal]
        status:
          type: string
          enum: [provisioning, active, suspended, deleting, deleted]
        plan:
          type: [string, 'null']
        data_mode_default:
          $ref: '#/components/schemas/DataMode'
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
    MyTenant:
      description: A tenant with the caller's role in it.
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          required: [tenant_role]
          properties:
            tenant_role:
              $ref: '#/components/schemas/TenantRole'
    MyTenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyTenant'

    Workspace:
      type: object
      required: [id, tenant_id, name, status, is_default, version, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, archived, deleted]
        is_default:
          type: boolean
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'

    Membership:
      type: object
      required: [tenant_id, user_id, tenant_role, status, joined_at, version, updated_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_role:
          $ref: '#/components/schemas/TenantRole'
        status:
          type: string
          enum: [active, deactivated, removed]
        joined_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        email:
          type: [string, 'null']
          description: In member lists.
        display_name:
          type: [string, 'null']
          description: In member lists.
    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'

    Manifest:
      type: object
      description: The part of an app manifest maturad stores and enforces.
      required: [name, auth, default_role, tenancy]
      properties:
        slug:
          type: string
        name:
          type: string
        client_id:
          type: string
        auth:
          type: object
          required: [redirect_uris]
          properties:
            redirect_uris:
              type: array
              items:
                type: string
            post_logout_redirect_uris:
              type: array
              items:
                type: string
            public_client:
              type: boolean
        permissions:
          type: array
          description: The permission catalogue; derived from roles when empty.
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
        roles:
          type: array
          description: Starter roles, editable in Matura afterwards.
          items:
            type: object
            required: [name, permissions]
            properties:
              name:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  type: string
        default_role:
          type: string
        owner_role:
          type: string
          description: Role tenant owners and admins get implicitly.
        tenancy:
          type: object
          properties:
            workspace_scoped:
              type: boolean
            modes:
              type: array
              items:
                $ref: '#/components/schemas/DataMode'
            managers:
              type: array
              items:
                type: string
                enum: [app, platform]
            default:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/DataMode'
                manager:
                  type: string
                  enum: [app, platform]

    App:
      type: object
      required: [id, slug, name, client_id, manifest, status, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        client_id:
          type: string
        manifest:
          $ref: '#/components/schemas/Manifest'
        status:
          type: string
          enum: [active, disabled]
        version:
          type: integer
          format: int64
    AppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'

    AppRole:
      type: object
      required: [app, name, description, permissions, is_default, origin, edited, version]
      properties:
        app:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        permissions:
          type: array
          items:
            type: string
        is_default:
          type: boolean
        origin:
          type: string
          enum: [manifest, platform]
        edited:
          type: boolean
          description: Changed in Matura, so manifests leave it alone.
        version:
          type: integer
          format: int64
    AppRoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppRole'

    TenantApp:
      type: object
      required: [tenant_id, app_id, app, status, version]
      properties:
        tenant_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        app:
          type: string
          description: App slug.
        status:
          type: string
          enum: [enabled, disabled]
        version:
          type: integer
          format: int64
        placement:
          $ref: '#/components/schemas/Placement'
    TenantAppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantApp'

    Placement:
      type: object
      description: Where one app keeps one tenant's data.
      required: [id, tenant_id, app_id, mode, manager, db_server_id, database_name, schema_name, location_label, state, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/DataMode'
        manager:
          type: string
          enum: [app, platform]
        db_server_id:
          type: [string, 'null']
          format: uuid
        database_name:
          type: [string, 'null']
        schema_name:
          type: [string, 'null']
        location_label:
          type: [string, 'null']
        state:
          type: string
          enum: [requested, provisioning, provisioned, migrating, ready, moving, retiring, deleted, failed]
        error:
          type: string
        version:
          type: integer
          format: int64
    PlacementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Placement'
    AppStorage:
      type: object
      additionalProperties: false
      required: [location_label]
      properties:
        location_label:
          type: string
          maxLength: 200
        database_name:
          type: string
        schema_name:
          type: string
    Credentials:
      type: object
      required: [host, port, sslmode, database, user, password, mode, expires_at]
      properties:
        host:
          type: string
        port:
          type: integer
        sslmode:
          $ref: '#/components/schemas/SSLMode'
        database:
          type: string
        user:
          type: string
        password:
          type: string
          format: password
        search_path:
          type: string
        mode:
          $ref: '#/components/schemas/DataMode'
        expires_at:
          type: string
          format: date-time

    Grant:
      type: object
      required: [id, tenant_id, app_id, app, workspace_id, subject_type, subject_id, role, status, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        app:
          type: string
          description: App slug.
        workspace_id:
          type: [string, 'null']
          format: uuid
        subject_type:
          type: string
          enum: [user, group, service_account]
        subject_id:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
          enum: [active, revoked]
        version:
          type: integer
          format: int64
    GrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'

    InvitedRole:
      type: object
      additionalProperties: false
      required: [app, role]
      properties:
        app:
          type: string
          description: App slug.
        role:
          type: string
        workspace_id:
          type: string
          format: uuid
    Invitation:
      type: object
      required: [id, tenant_id, email, tenant_role, app_roles, delivery, deliver_to, expires_at, state, invited_by,
        accepted_by, accepted_at, sent_count, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        tenant_role:
          $ref: '#/components/schemas/TenantRole'
        app_roles:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/InvitedRole'
        delivery:
          type: string
          enum: [link, temp_password]
        deliver_to:
          type: [string, 'null']
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, accepted, revoked, expired]
        invited_by:
          type: [string, 'null']
          format: uuid
        accepted_by:
          type: [string, 'null']
          format: uuid
        accepted_at:
          type: [string, 'null']
          format: date-time
        sent_count:
          type: integer
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    InvitationWithLink:
      description: An invitation with the link just made. The link is not stored; pass it on when email is not set up.
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [accept_url]
          properties:
            accept_url:
              type: string
              format: uri
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    InvitationPreview:
      type: object
      required: [tenant_name, email, state, expires_at]
      properties:
        tenant_name:
          type: string
        email:
          type: string
        state:
          type: string
          enum: [pending, accepted, revoked, expired]
        expires_at:
          type: string
          format: date-time

    PortalConfig:
      type: object
      required: [auth, issuer, client_id, product]
      properties:
        auth:
          type: string
          enum: [oidc, dev]
        issuer:
          type: string
          description: OIDC issuer the browser signs in with; empty when not configured.
        client_id:
          type: string
          description: Public client (default `matura-console`).
        product:
          type: string

    Plan:
      type: object
      required: [id, name, data_mode_required, data_mode_default, limits]
      properties:
        id:
          type: string
        name:
          type: string
        data_mode_required:
          oneOf:
            - $ref: '#/components/schemas/DataMode'
            - type: 'null'
        data_mode_default:
          $ref: '#/components/schemas/DataMode'
        limits:
          type: [object, 'null']
          additionalProperties: true
    PlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plan'

    DBServer:
      type: object
      required: [id, name, host, port, admin_user, admin_secret_fingerprint, sslmode, region, dedicated, labels, status,
        version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        admin_user:
          type: string
        admin_secret_fingerprint:
          type: string
          description: Identifies the stored password; the password itself is never returned.
        sslmode:
          $ref: '#/components/schemas/SSLMode'
        region:
          type: [string, 'null']
        dedicated:
          type: boolean
        labels:
          type: [object, 'null']
          additionalProperties: true
        status:
          type: string
          enum: [active, draining, disabled]
        version:
          type: integer
          format: int64
    DBServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DBServer'
    DBServerCheck:
      type: object
      required: [ok, can_create_databases, can_create_roles]
      properties:
        ok:
          type: boolean
        server_version:
          type: string
        can_create_databases:
          type: boolean
        can_create_roles:
          type: boolean
        error:
          type: string

    AppSecret:
      type: object
      required: [id, app, client_id, label, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        app:
          type: string
        client_id:
          type: string
        label:
          type: string
        secret:
          type: string
          description: Only in the create response.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
    AppSecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppSecret'

    Webhook:
      type: object
      required: [id, app, url, status, cursor, attempts, first_failed_at, next_attempt_at, last_status, last_error,
        delivered, dropped, created_at]
      properties:
        id:
          type: string
          format: uuid
        app:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Signing secret; only in the create response.
        status:
          type: string
          enum: [active, failing, disabled]
        cursor:
          type: integer
          format: int64
          description: Last change-feed sequence delivered.
        attempts:
          type: integer
        first_failed_at:
          type: [string, 'null']
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        last_status:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        delivered:
          type: integer
          format: int64
        dropped:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    WebhookTestResult:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
        status:
          type: integer
          description: HTTP status the receiver answered; 0 when it could not be reached.
        error:
          type: string

    Change:
      type: object
      description: |
        A change as a CloudEvent (structured JSON). `data` holds the object's name, its version (for the apply
        rule) and the object itself under that name, e.g. `{"object": "membership", "version": 3, "membership": {…}}`.
      required: [specversion, id, source, type, time, subject, sequence, datacontenttype, data]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
        source:
          type: string
        type:
          type: string
          examples: [matura.membership.added]
        time:
          type: string
          format: date-time
        subject:
          type: string
        tenantid:
          type: string
          format: uuid
        sequence:
          type: string
          description: Position in the feed.
        datacontenttype:
          type: string
          const: application/json
        data:
          type: object
          required: [object, version]
          properties:
            object:
              type: string
            version:
              type: integer
              format: int64
          additionalProperties: true

    Snapshot:
      type: object
      required: [cursor, workspaces, users, memberships, grants, roles]
      properties:
        cursor:
          type: string
          description: Read the change feed from here.
        tenant:
          oneOf:
            - $ref: '#/components/schemas/Tenant'
            - type: 'null'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        placement:
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AppRole'
        tenants:
          type: [array, 'null']
          description: Without `tenant`, the ids of tenants that enabled the app.
          items:
            type: string
            format: uuid

    TokenContext:
      type: object
      description: The Matura claims of an access token.
      required: [troles, roles, ver]
      properties:
        tid:
          type: string
          format: uuid
        tenant:
          type: string
          description: Tenant slug.
        wid:
          type: string
          format: uuid
        troles:
          type: [array, 'null']
          items:
            type: string
        roles:
          type: [array, 'null']
          items:
            type: string
        perms:
          type: array
          items:
            type: string
        perms_ref:
          type: string
          description: Set instead of `perms` when the list is too long for a token.
        ver:
          type: [object, 'null']
          additionalProperties:
            type: integer
            format: int64
        pmode:
          $ref: '#/components/schemas/DataMode'
    TokenRefusal:
      type: object
      required: [error, error_description, detail]
      properties:
        error:
          type: string
          const: access_denied
        error_description:
          type: string
          description: Refusal code, passed on as the OAuth error description.
        detail:
          type: string
    AuditEvent:
      type: object
      required: [id, tenant_id, seq, time, actor, action, target, request_id, ip, user_agent, data, prev_hash, hash]
      description: |
        One audit record. `hash` is the hex SHA-256 of the record's canonical JSON (technical specification §13),
        which includes `prev_hash`, the previous event's hash in the same chain (64 zeros for the first).
      properties:
        id:
          type: integer
          format: int64
          description: Position across all chains; the list cursor.
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: Null for installation events.
        seq:
          type: integer
          format: int64
          description: Position in the chain, from 1.
        time:
          type: string
          format: date-time
        actor:
          type: object
          required: [kind, id, email]
          properties:
            kind:
              type: string
              enum: [user, operator, app, system]
            id:
              type: [string, 'null']
              format: uuid
            email:
              type: string
        action:
          type: string
          description: e.g. `membership.added`, `invitation.created`, `security_policy.updated`, `authz.denied`.
        target:
          type: string
        request_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        data:
          description: The changed object, or details of the action.
        prev_hash:
          type: string
        hash:
          type: string
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']
    AuditVerification:
      type: object
      required: [ok, events, head_seq, head_hash, first_break]
      properties:
        ok:
          type: boolean
        events:
          type: integer
          format: int64
          description: Events checked before the first break.
        head_seq:
          type: integer
          format: int64
        head_hash:
          type: string
        first_break:
          oneOf:
            - type: 'null'
            - type: object
              required: [seq, reason]
              properties:
                seq:
                  type: integer
                  format: int64
                id:
                  type: integer
                  format: int64
                reason:
                  type: string
    AuditSink:
      type: object
      required: [id, tenant_id, kind, url, status, cursor, attempts, next_attempt_at, last_status, last_error,
        delivered, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [webhook]
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Signing secret; only in the create response.
        status:
          type: string
          enum: [active, failing, disabled]
        cursor:
          type: integer
          format: int64
          description: Last chain `seq` the receiver acknowledged.
        attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_status:
          type: [integer, 'null']
        last_error:
          type: [string, 'null']
        delivered:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    AuditSinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditSink'
    SecurityPolicy:
      type: object
      required: [tenant_id, require_mfa, session_max_age, idle_timeout, allowed_email_domains, ip_allowlist, version,
        updated_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        require_mfa:
          type: boolean
        session_max_age:
          type: [integer, 'null']
          description: Seconds.
        idle_timeout:
          type: [integer, 'null']
          description: Seconds.
        allowed_email_domains:
          type: array
          items:
            type: string
        ip_allowlist:
          type: array
          description: CIDR ranges.
          items:
            type: string
        version:
          type: integer
          format: int64
        updated_at:
          type: [string, 'null']
          format: date-time
    EvidenceKind:
      type: string
      enum: [restore-test, access-review, vulnerability-scan]
    Evidence:
      type: object
      required: [id, kind, passed, details, recorded_at, recorded_by, seq, hash]
      properties:
        id:
          type: integer
          format: int64
          description: The audit event's id.
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        passed:
          type: boolean
        details:
          type: object
        recorded_at:
          type: string
          format: date-time
        recorded_by:
          type: string
          description: Email (or id) of the operator whose token recorded it.
        seq:
          type: integer
          format: int64
          description: Position in the installation audit chain.
        hash:
          type: string
          description: The audit event's hash (hex).
    FrameworkRef:
      type: object
      required: [framework, id]
      properties:
        framework:
          type: string
          enum: [SOC 2, ISO/IEC 27001:2022, GDPR]
        id:
          type: string
          examples: [CC6.1, A.8.13, Art. 32(1)(c)]
    ReadinessControl:
      type: object
      required: [id, title, scope, status, evidence, fix, docs, public, optional, refs]
      properties:
        id:
          type: string
          examples: [install-kek, tenant-mfa]
        title:
          type: string
        scope:
          type: string
          enum: [installation, tenant]
        status:
          type: string
          enum: [pass, fail, not-applicable]
        evidence:
          type: string
        fix:
          type: string
        docs:
          type: string
          format: uri
        public:
          type: boolean
          description: Shown on the trust page.
        optional:
          type: boolean
          description: Counted only when configured.
        refs:
          type: array
          items:
            $ref: '#/components/schemas/FrameworkRef'
        tenants:
          type: array
          description: Tenant controls only, one entry per active tenant.
          items:
            type: object
            required: [tenant_id, slug, status, evidence]
            properties:
              tenant_id:
                type: string
                format: uuid
              slug:
                type: string
              status:
                type: string
                enum: [pass, fail, not-applicable]
              evidence:
                type: string
    ReadinessReport:
      type: object
      required: [generated_at, product, notice, score, passed, failed, not_applicable, controls, summary]
      properties:
        generated_at:
          type: string
          format: date-time
        product:
          type: string
        notice:
          type: string
        score:
          type: number
          description: Percent of applicable controls that pass, one decimal.
        passed:
          type: integer
        failed:
          type: integer
        not_applicable:
          type: integer
        controls:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessControl'
        summary:
          type: object
          description: Settings policy templates are filled from (docs/guide/readiness.md).
          additionalProperties: true
    Trust:
      type: object
      required: [product, generated_at, notice, in_place, applicable, controls]
      properties:
        product:
          type: string
        generated_at:
          type: string
          format: date-time
        notice:
          type: string
        in_place:
          type: integer
        applicable:
          type: integer
        security_contact:
          type: string
        controls:
          type: array
          items:
            type: object
            required: [id, title, status, refs]
            properties:
              id:
                type: string
              title:
                type: string
              status:
                type: string
                enum: [in-place, not-in-place, not-applicable]
              refs:
                type: array
                items:
                  $ref: '#/components/schemas/FrameworkRef'
