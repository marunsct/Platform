      summary: Set a tenant's plan and overrides
      description: |
        Operators. `plan` null or "" removes the plan (no limits). `overrides` (same shape as a plan's limits)
        replaces the tenant's overrides; leave it out to keep them, null to clear them. Usage above a new limit is
        kept; only new additions are refused. Existing placements keep their data mode.
      tags: [operator, entitlements]
