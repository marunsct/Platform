            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: A page of tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummaryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /admin/v1/tenants/{tid}:
    parameters:
      - $ref: '#/components/parameters/tid'
    delete:
      operationId: adminDeleteTenant
      summary: Delete a tenant (operators)
      description: As `DELETE /v1/tenants/{tid}`; `grace_days=0` lets the purger delete it on its next round.
      tags: [operator]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/GraceDays'
        - $ref: '#/components/parameters/DeletionReason'
      responses:
        '202':
          description: Deletion scheduled; the tenant with status `pending_deletion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/v1/tenants/{tid}:suspend:
    parameters:
      - $ref: '#/components/parameters/tid'
    post:
      operationId: suspendTenantAdmin
      summary: Suspend a tenant
      description: Operators. Sign-in into the tenant is refused (`tenant_suspended`) and its API answers 403 `tenant-suspended` to members; apps get `tenant.suspended`. Repeating it updates the reason.
      tags: [operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Shown to operators only.
      responses:
        '200':
          description: The tenant.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /admin/v1/tenants/{tid}:resume:
    parameters:
      - $ref: '#/components/parameters/tid'
    post:
      operationId: resumeTenantAdmin
      summary: Resume a suspended tenant
      description: Operators. Apps get `tenant.reactivated`.
      tags: [operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The tenant.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /admin/v1/tenants/{tid}:restore:
    parameters:
      - $ref: '#/components/parameters/tid'
    post:
      operationId: restoreTenantAdmin
      summary: Restore a tenant pending deletion (operators)
      description: Operators. As `POST /v1/tenants/{tid}:restore`.
      tags: [operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
