        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: recordEvidence
      summary: Record evidence
      description: |
        Operators and scripts with an operator token (`scripts/backup.sh restore-test --report`). The evidence is
        appended to the installation audit chain as action `evidence.<kind>`, so it is tamper-evident; it cannot be
        changed or deleted. A restore test and a vulnerability scan stay current for 35 days, an access review for 92.
      tags: [operator, readiness]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, passed]
              additionalProperties: false
              properties:
                kind:
                  $ref: '#/components/schemas/EvidenceKind'
