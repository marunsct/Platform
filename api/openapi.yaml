    get:
      operationId: adminListSupportAccess
      summary: List a tenant's support access requests (operators)
      tags: [operator, support-access]
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: requestSupportAccess
      summary: Request support access
      description: |
        Operators. Asks for read-only access to the tenant's admin views (its GET routes) for up to 8 hours. With
        the tenant's `support_access` `approval` (default) an owner must approve it within 24 hours; with `allowed`
        it starts at once; with `off` it is refused (403 `support-access-off`). The tenant sees the request, the
        decision and every use. No token is issued: the operator keeps their own identity.
      tags: [operator, support-access]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, duration_minutes]
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Shown to the tenant.
                duration_minutes:
                  type: integer
                  minimum: 1
                  maximum: 480
      responses:
        '201':
          description: The request (`pending`, or `active` when the tenant allows access without approval).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
