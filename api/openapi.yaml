    get:
      operationId: getAppSnapshot
      summary: Read a snapshot
      description: |
        With `tenant`: that tenant's state as the app sees it. Without: the app's roles and the ids of tenants that
        enabled it. Continue with the change feed from `cursor`.
      tags: [app-backend]
      security:
        - appBasic: []
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/apps/{app}/placements/{tid}:
