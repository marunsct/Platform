openapi: 3.1.0
info:
  title: Matura control plane API
  version: 0.1.0
  summary: The HTTP API of maturad, Matura's control plane.
  description: |
    Tenants, workspaces, members, invitations, app enablement, role grants, data placement and the app change feed.

    - Users and operators send an OIDC access token from Keycloak (`bearer`). Endpoints under `/admin/v1` need the
      operator realm role.
    - App backends send HTTP Basic with their client id and secret (`appBasic`) to `/v1/apps/{app}/changes`,
      `/snapshot`, `/placements` and `/tenants/{tid}` (resource permissions). Another app's slug answers 404.
    - Keycloak's Matura extension calls `/internal/v1` with the shared `MATURA_INTERNAL_TOKEN` (`internalToken`).
      These routes are only served when that token is configured.

    Errors are `application/problem+json`. Ids of other tenants, and ids that are not UUIDs, answer 404 so they
    cannot be probed. Request bodies reject unknown fields (400). A POST under `/v1` or `/admin/v1` may carry an
    `Idempotency-Key`; a retry with the same key and body gets the stored response with `Idempotency-Replayed: true`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: health
    description: Probes and liveness.
  - name: portal
    description: The customer portal web app.
  - name: me
    description: The signed-in user.
  - name: tenants
    description: Tenants (organisations).
  - name: workspaces
    description: Workspaces inside a tenant.
  - name: members
    description: Tenant memberships.
  - name: invitations
    description: Invitations to join a tenant.
  - name: apps
    description: Apps, their roles and which tenants enabled them.
  - name: grants
    description: App role grants to members.
  - name: placements
    description: Where tenant data lives.
  - name: audit
    description: The tamper-evident audit log and its streaming destinations.
  - name: security
    description: Tenant security policies.
  - name: readiness
    description: Readiness controls, evidence and the public trust page. Readiness is not an audit or a certification.
  - name: privacy
    description: Tenant data export, audit retention and legal hold.
  - name: operator
    description: Installation operators only.
  - name: entitlements
    description: Plans, limits and usage.
  - name: support-access
    description: Time-boxed, read-only operator access a tenant approves.
  - name: app-backend
    description: Called by app backends with their client credentials.
  - name: permissions
    description: Fine-grained resource permissions on OpenFGA (optional component).
  - name: internal
    description: Called by Keycloak's Matura extension.

paths:
  # --- health and public pages ------------------------------------------------------------------------------------
  /healthz/live:
    get:
      operationId: live
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        '204':
          description: The process is up.
  /healthz/ready:
    get:
      operationId: ready
      summary: Readiness probe
      description: Checks that the database answers.
      tags: [health]
      security: []
      responses:
        '204':
          description: Ready to serve.
        '503':
          $ref: '#/components/responses/NotReady'
  /trust:
    get:
      operationId: trustPage
      summary: Public trust page
      description: |
        The installation's public security posture: the readiness controls marked public, each in place, not in
        place or not applicable, with framework references. No evidence text or tenant data. Off unless
        `MATURA_TRUST_PAGE=on` (404 otherwise). Rendered on request and kept for five minutes; no scripts, a strict
        Content-Security-Policy with the inline style's hash.
      tags: [readiness]
      security: []
      responses:
        '200':
          description: The page.
          headers:
            Content-Security-Policy:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /trust.json:
    get:
      operationId: trustJSON
      summary: Public trust page as JSON
      description: The same content as `/trust`, machine-readable. Off unless `MATURA_TRUST_PAGE=on`.
      tags: [readiness]
      security: []
      responses:
        '200':
          description: The public posture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trust'
        '404':
          $ref: '#/components/responses/NotFound'
  /invitations/accept:
    get:
      operationId: invitationAcceptPage
      summary: Invitation accept page
      description: |
        Self-contained HTML page an invitation link opens. It shows the invitation (from `/invitations/preview`),
        signs the invitee in with Keycloak (authorization code with PKCE) and calls `POST /v1/invitations:accept`.
      tags: [invitations]
      security: []
      parameters:
        - name: token
          in: query
          description: The invitation token from the link. Read by the page's script, not by the server.
          schema:
            type: string
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string
  /invitations/preview:
    get:
      operationId: previewInvitation
      summary: Preview an invitation
      description: 'Unauthenticated; the token is the credential. Responses are `Cache-Control: no-store`.'
      tags: [invitations]
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: What the accept page shows before sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '410':
          $ref: '#/components/responses/Gone'
  /portal/:
    get:
      operationId: portalApp
      summary: Customer portal
      description: |
        The customer portal, a single-page app embedded in maturad. Built files are served as they are (hashed
        `assets/` are cached for a year); any other path under `/portal/` returns `index.html` so the app's router
        can show it, except missing files with an extension, which are 404. Every response carries a strict
        Content-Security-Policy (`script-src 'self'`, `style-src 'self'`, `connect-src` limited to maturad and the
        issuer). `/portal` redirects here.
      tags: [portal]
      security: []
      responses:
        '200':
          description: A built file, or `index.html` for the app's own routes.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: A missing file.
  /portal/config.json:
    get:
      operationId: portalConfig
      summary: Portal runtime configuration
      description: |
        What the portal needs to sign in: the OIDC issuer and the public client it uses (authorization code with
        PKCE), or `auth: dev` when maturad trusts development headers. `Cache-Control: no-store`.
      tags: [portal]
      security: []
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalConfig'

  # --- me ---------------------------------------------------------------------------------------------------------
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [me]
      responses:
        '200':
          description: The user's profile and whether they are an operator.
          content:
            application/json:
              schema:
                type: object
                required: [user, operator]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  operator:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteMe
      summary: Erase the signed-in user's account
      description: |
        GDPR erasure (technical specification §14.2), the same as an operator's `DELETE /admin/v1/users/{uid}`:
        memberships end and grants are revoked (contract events, so apps delete the user), pending invitations to the
        address are revoked and every invitation to it carries the pseudonym, queued mail to it is deleted, the
        email and name are shown as `deleted-user-<hash>` wherever the audit log is read (the hashed events are not
        edited, so every chain still verifies), the account is marked deleted and the sign-in account is deleted in
        the identity provider when one is configured. Refused with 409 `last-owner` (listing the `tenants`) while the
        user is the only owner of a tenant.
      tags: [me]
      responses:
        '204':
          description: Erased.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastOwner'
  /v1/me/export:
    get:
      operationId: exportMe
      summary: Export everything Matura holds about the signed-in user
      description: |
        GDPR access and portability (technical specification §14.2): the profile, memberships in every tenant (any
        state), app role grants (active and revoked), invitations to the user's address, and the audit events the
        user caused (newest 50 000; `truncated` says when more exist). Recorded as `user.exported`.
      tags: [me]
      responses:
        '200':
          description: The user's data, as a JSON attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/tenants:
    get:
      operationId: listMyTenants
      summary: Tenants the signed-in user belongs to
      description: Active memberships in tenants that are not being deleted, with the user's role; for tenant switchers.
      tags: [me]
      responses:
        '200':
          description: The tenants, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTenantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- tenants ----------------------------------------------------------------------------------------------------
  /v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: The caller's tenants; operators see all.
      tags: [tenants]
      responses:
        '200':
          description: The tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTenant
      summary: Create a tenant
      description: |
        The caller becomes its owner. Only operators may set `plan`, `owner_id` or a `kind` other than `company`.
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
                kind:
                  type: string
                  enum: [company, shared, personal]
                  default: company
                plan:
                  type: string
                  description: Operators only.
                owner_id:
                  type: string
                  format: uuid
                  description: Operators only; create the tenant on someone's behalf.
      responses:
        '201':
          description: The new tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: getTenant
      summary: Get a tenant
      description: Members and operators. The `ETag` is the tenant's version, for `If-Match`.
      tags: [tenants]
      responses:
        '200':
          description: The tenant.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: |
        Owners and admins may rename; only owners (and operators) set `support_access`; only operators change `plan`
        or `status` (`suspended` with a `reason`, or `active`: the same as `:suspend` and `:resume`). A suspended
        tenant answers 403 `tenant-suspended` to its members.
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                plan:
                  type: string
                  description: Operators only.
                status:
                  type: string
                  enum: [active, suspended]
                  description: Operators only. Delete a tenant with DELETE.
                reason:
                  type: string
                  description: Why the tenant is suspended (operators; required to suspend).
                support_access:
                  $ref: '#/components/schemas/SupportAccessPolicy'
      responses:
        '200':
          description: The updated tenant.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteTenant
      summary: Delete a tenant
      description: |
        Owners and operators. The tenant becomes `pending_deletion` with `purge_after` (default 30 days,
        `MATURA_TENANT_DELETE_GRACE`) and can be restored until then with `:restore`; members can only read it.
        Apps see it as suspended. After the grace period the purger moves it to `deleting` (apps get
        `tenant.deleting` and delete its data, placements retire) and, once every placement is deleted, `deleted`.
        Repeating the call changes nothing.
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/GraceDays'
        - $ref: '#/components/parameters/DeletionReason'
      responses:
        '202':
          description: Deletion scheduled; the tenant with status `pending_deletion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'

  /v1/tenants/{tid}:restore:
    parameters:
      - $ref: '#/components/parameters/tid'
    post:
      operationId: restoreTenant
      summary: Restore a tenant pending deletion
      description: Owners and operators, until `purge_after`. The tenant returns to the status it had (a suspended tenant stays suspended).
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The restored tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tid}/entitlements:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: getEntitlements
      summary: Get the tenant's plan, limits and usage
      description: Members and operators.
      tags: [entitlements]
      responses:
        '200':
          description: The entitlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/support-access:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listTenantSupportAccess
      summary: List support access requests
      description: Owners and admins see every request, decision and use (newest first, at most 200).
      tags: [support-access]
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccessList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/support-access/{id}:approve:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    post:
      operationId: approveSupportAccess
      summary: Approve a support access request
      description: Owners. The access starts now and lasts `duration_minutes`.
      tags: [support-access]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tid}/support-access/{id}:deny:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    post:
      operationId: denySupportAccess
      summary: Deny a support access request
      description: Owners.
      tags: [support-access]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tid}/support-access/{id}:revoke:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    post:
      operationId: revokeSupportAccess
      summary: Revoke support access
      description: Owners. Ends a pending or active grant at once.
      tags: [support-access]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- workspaces -------------------------------------------------------------------------------------------------
  /v1/tenants/{tid}/workspaces:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listWorkspaces
      summary: List workspaces
      tags: [workspaces]
      responses:
        '200':
          description: The tenant's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: Owners and admins.
      tags: [workspaces]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: The new workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}/workspaces/{wid}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/wid'
    patch:
      operationId: updateWorkspace
      summary: Update a workspace
      description: Owners and admins. Rename or archive.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [active, archived, deleted]
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # --- members ----------------------------------------------------------------------------------------------------
  /v1/tenants/{tid}/members:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listMembers
      summary: List members
      tags: [members]
      responses:
        '200':
          description: The tenant's members, with email and display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addMember
      summary: Add a member
      description: |
        Owners and admins add someone who already has an account, by `user_id` or `email` (422 when no account uses
        the email; invite them instead). Only owners add owners. The member gets each enabled app's default role.
      tags: [members]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                tenant_role:
                  $ref: '#/components/schemas/TenantRole'
      responses:
        '201':
          description: The membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}/members/{uid}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/uid'
    patch:
      operationId: updateMember
      summary: Change a member's role or status
      description: Owners and admins; only owners make, change or unmake owners.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_role:
                  $ref: '#/components/schemas/TenantRole'
                status:
                  type: string
                  enum: [active, deactivated, removed]
      responses:
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: removeMember
      summary: Remove a member
      description: Anyone may leave; removing someone else needs owner or admin, and removing an owner needs an owner.
      tags: [members]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- tenant apps ------------------------------------------------------------------------------------------------
  /v1/tenants/{tid}/apps:
