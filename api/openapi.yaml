        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/apps/{app}/placements/{tid}:ready:
    parameters:
      - $ref: '#/components/parameters/app'
      - $ref: '#/components/parameters/tid'
    post:
      operationId: markAppPlacementReady
      summary: Confirm migrations ran
      description: The app has migrated the tenant's storage; the placement becomes `ready`.
      tags: [app-backend, placements]
      security:
        - appBasic: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
