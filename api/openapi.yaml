    parameters:
      - $ref: '#/components/parameters/app'
      - $ref: '#/components/parameters/tid'
    post:
      operationId: getAppPlacementCredentials
      summary: Get database credentials
      description: |
        Short-lived connection details for a platform-managed placement (`Cache-Control: no-store`). `purpose: migrate`
        returns the role that owns the tables. The body may be empty.
      tags: [app-backend, placements]
