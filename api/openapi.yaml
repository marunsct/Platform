          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createGrant
      summary: Grant an app role
      description: Owners and admins. `workspace_id` scopes the grant to one workspace of a workspace-scoped app.
      tags: [grants]
