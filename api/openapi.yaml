  # --- app backends -----------------------------------------------------------------------------------------------
  /v1/apps/{app}/changes:
    parameters:
      - $ref: '#/components/parameters/app'
    get:
      operationId: getAppChanges
      summary: Read the app's change feed
      description: |
        CloudEvents for tenants that enabled the app, in sequence order. Pass `next_cursor` back as `cursor`.
        410 when the cursor is older than the feed keeps; start again from a snapshot.
      tags: [app-backend]
      security:
        - appBasic: []
      parameters:
        - name: cursor
          in: query
          description: Read changes after this cursor; omit to start from the beginning.
          schema:
            type: string
            pattern: '^[0-9]+$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, has_more]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Change'
                  next_cursor:
                    type: string
                  has_more:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/apps/{app}/snapshot:
    parameters:
      - $ref: '#/components/parameters/app'
    get:
      operationId: getAppSnapshot
      summary: Read a snapshot
      description: |
        With `tenant`: that tenant's state as the app sees it. Without: the app's roles and the ids of tenants that
        enabled it. Continue with the change feed from `cursor`.
      tags: [app-backend]
      security:
        - appBasic: []
      parameters:
        - name: tenant
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
