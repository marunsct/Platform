                  type: [string, 'null']
                  format: uuid
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}/grants/{id}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    delete:
      operationId: revokeGrant
      summary: Revoke a grant
      description: Owners and admins.
      tags: [grants]
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # --- placements (tenant view) -----------------------------------------------------------------------------------
  /v1/tenants/{tid}/placements:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listTenantPlacements
      summary: Where the tenant's app data lives
      tags: [placements]
      responses:
        '200':
          description: One placement per enabled app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- invitations ------------------------------------------------------------------------------------------------
  /v1/tenants/{tid}/invitations:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listInvitations
      summary: List invitations
      description: Owners and admins. A pending invitation past `expires_at` lists as `expired`.
      tags: [invitations]
      responses:
        '200':
          description: The invitations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createInvitation
      summary: Invite someone
      description: |
        Owners and admins; only owners invite owners. Emails a link valid for 7 days. App roles are checked up front.
        An active member's address answers 409; an earlier pending invitation to the address is revoked.
        `delivery: temp_password` answers 422 (not built yet).
      tags: [invitations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                tenant_role:
                  $ref: '#/components/schemas/TenantRole'
                app_roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/InvitedRole'
                delivery:
                  type: string
                  enum: [link, temp_password]
                  default: link
                deliver_to:
                  type: string
                  description: Send the email here instead of the invited address.
      responses:
        '201':
          description: The invitation, with its link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}/invitations/{id}:resend:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    post:
      operationId: resendInvitation
      summary: Resend an invitation
      description: |
        Owners and admins. Issues a new token and expiry (the old link stops working); works on pending and expired
        invitations.
      tags: [invitations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The invitation, with its new link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tid}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: Owners and admins; ends a pending invitation.
      tags: [invitations]
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # --- audit log and security policy ------------------------------------------------------------------------------
  /v1/tenants/{tid}/audit:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listAudit
      summary: Read the tenant's audit log
      description: |
        Owners and admins (and operators). Newest first; pass `next_cursor` back as `cursor` for the next page
        (`null` on the last page).
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/auditActor'
        - $ref: '#/components/parameters/auditAction'
        - $ref: '#/components/parameters/auditFrom'
        - $ref: '#/components/parameters/auditTo'
        - $ref: '#/components/parameters/auditCursor'
        - $ref: '#/components/parameters/auditLimit'
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/audit/export:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: exportAudit
      summary: Export the tenant's audit log
      description: |
        Owners and admins. Streams the chain oldest first as NDJSON, one `AuditEvent` per line with its hashes, so
        the receiver can check the chain itself. The export is itself recorded (`audit.exported`).
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/auditFrom'
        - $ref: '#/components/parameters/auditTo'
      responses:
        '200':
          description: The events, one JSON object per line.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/audit:verify:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: verifyAudit
      summary: Verify the tenant's audit chain
      description: |
        Owners and admins. Recomputes every hash, checks each event links to the one before and that the chain ends
        at its recorded head, and reports the first break.
      tags: [audit]
      responses:
        '200':
          description: The result; `ok` is false when the chain is broken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/audit/sinks:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listAuditSinks
      summary: List audit streaming destinations
      description: Owners and admins. Includes delivery state.
      tags: [audit]
      responses:
        '200':
          description: The destinations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAuditSink
      summary: Add an audit streaming destination
      description: |
        Owners and admins; at most 10. maturad POSTs new events in chain order as NDJSON batches signed with
        `Matura-Signature` (as webhooks are), and retries until a 2xx; events are never skipped. It starts after the
        newest event, or at the start of the chain with `backfill`. The response carries the signing secret once
        (`Cache-Control: no-store`).
      tags: [audit]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                kind:
                  type: string
                  enum: [webhook]
                  default: webhook
                url:
                  type: string
                  format: uri
                backfill:
                  type: boolean
                  default: false
      responses:
        '201':
          description: The destination, with its signing secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/tenants/{tid}/audit/sinks/{id}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    patch:
      operationId: updateAuditSink
      summary: Change an audit streaming destination
      description: Owners and admins. Change the URL, or disable and re-enable delivery.
      tags: [audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '200':
          description: The updated destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: deleteAuditSink
      summary: Delete an audit streaming destination
      description: Owners and admins.
      tags: [audit]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/security-policy:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: getSecurityPolicy
      summary: Read the tenant's security policy
      description: Owners and admins. A tenant that never set one gets the default (nothing enforced, version 0).
      tags: [security]
      responses:
        '200':
          description: The policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putSecurityPolicy
      summary: Replace the tenant's security policy
      description: |
        Owners and admins. maturad enforces `allowed_email_domains` on new invitations (422 otherwise) and
        `ip_allowlist` on every tenant API call by members (403 `ip-not-allowed`; operators are exempt; replicas
        pick a change up within 5 s). The allow-list must include the caller's own address. `require_mfa`,
        `session_max_age` and `idle_timeout` are stored for Keycloak to enforce.
      tags: [security]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                require_mfa:
                  type: boolean
                session_max_age:
                  type: [integer, 'null']
                  minimum: 300
                  description: Seconds; null is the installation default.
                idle_timeout:
                  type: [integer, 'null']
                  minimum: 60
                  description: Seconds, at most session_max_age; null is the installation default.
                allowed_email_domains:
                  type: array
                  items:
                    type: string
                ip_allowlist:
                  type: array
                  description: Addresses or CIDR ranges.
                  items:
                    type: string
      responses:
        '200':
          description: The policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/invitations:accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Called by the signed-in invitee. 410 when the invitation is accepted, revoked or expired, the tenant is not
        active or the token is unknown; 403 when the signed-in email is not the invited one.
      tags: [invitations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The accepted invitation and the membership.
          content:
            application/json:
              schema:
                type: object
                required: [invitation, membership]
                properties:
                  invitation:
                    $ref: '#/components/schemas/Invitation'
                  membership:
                    $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PlanLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'

  # --- privacy: tenant export and audit retention -----------------------------------------------------------------
  /v1/tenants/{tid}/exports:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: listExports
      summary: List the tenant's data exports
      description: Owners and operators. The 50 newest, newest first.
      tags: [privacy]
      responses:
        '200':
          description: The exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createExport
      summary: Export the tenant's data
      description: |
        Owners and operators (technical specification §14.1). Queues a job; the privacy worker builds a JSON bundle
        of the tenant, its workspaces, members, invitations, active grants and the roles they use, placements (no
        credentials), security policy, retention, and the audit chain from its anchor with hashes. One export runs
        at a time per tenant (409 otherwise). Poll the export until `state` is `ready`, then download it.
      tags: [privacy]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/tenants/{tid}/exports/{id}:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    get:
      operationId: getExport
      summary: Read an export's state
      description: Owners and operators.
      tags: [privacy]
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants/{tid}/exports/{id}/download:
    parameters:
      - $ref: '#/components/parameters/tid'
      - $ref: '#/components/parameters/id'
    get:
      operationId: downloadExport
      summary: Download a ready export
      description: |
        Owners and operators, for 24 hours after the export is ready; then the bundle is deleted (410). Each
        download is recorded as `tenant_export.downloaded`. `Matura-Export-SHA256` is the bundle's digest.
      tags: [privacy]
      responses:
        '200':
          description: The bundle, as a JSON attachment.
          headers:
            Matura-Export-SHA256:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBundle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/tenants/{tid}/retention:
    parameters:
      - $ref: '#/components/parameters/tid'
    get:
      operationId: getRetention
      summary: Read the tenant's audit retention and legal hold
      description: Owners and admins. A tenant that never set one gets the default (400 days, no hold, version 0).
      tags: [privacy]
      responses:
        '200':
          description: The retention.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putRetention
      summary: Set the tenant's audit retention and legal hold
      description: |
        Owners and operators. The privacy worker deletes audit events older than `retention_days` (hourly) by
        moving the chain's anchor, so verification still passes; nothing is deleted while `legal_hold` is on.
        Recorded as `audit_retention.updated`.
      tags: [privacy]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
