<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow an agent · {{.Product}}</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --card: #fff; --line: #e5e5ea; --accent: #2f5bea; --danger: #c4314b; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; --card: #1c1c1f; --line: #2c2c30; --accent: #7c9cff; --danger: #ff6b81; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 32rem; margin: 10vh auto; padding: 2rem; background: var(--card); border-radius: 12px; }
  @media (max-width: 34rem) { main { margin: 0; border-radius: 0; min-height: 100vh; box-sizing: border-box; padding: 1.5rem 1rem; } }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; } h2 { font-size: .95rem; margin: 1.25rem 0 .5rem; }
  p { margin: .5rem 0; } .muted { color: var(--muted); font-size: .9rem; }
  ul { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 8px; }
  li { padding: .5rem .75rem; border-top: 1px solid var(--line); display: flex; gap: .6rem; align-items: flex-start; }
  li:first-child { border-top: 0; } li code { font-size: .85rem; } label { cursor: pointer; flex: 1; }
  .actions { display: flex; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  button { font: inherit; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer;
           background: var(--accent); color: #fff; } button.secondary { background: none; color: var(--accent); }
  button.danger { background: none; color: var(--danger); border-color: var(--danger); }
  select { font: inherit; padding: .35rem; border-radius: 6px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p id="message"></p>
  <div id="details" hidden>
    <p class="muted" id="who"></p>
    <h2>It will be able to do this for you</h2>
    <ul id="perms"></ul>
    <p class="muted">Untick anything you do not want it to do. It never gets more than you can do yourself.</p>
    <h2><label for="expiry">For how long</label></h2>
    <select id="expiry">
      <option value="">Until I withdraw it</option>
      <option value="1">1 day</option>
      <option value="30">30 days</option>
      <option value="90">90 days</option>
    </select>
  </div>
  <p id="note" class="muted"></p>
  <div class="actions" id="actions" hidden>
    <button id="allow">Allow</button>
    <button id="deny" class="secondary">Don't allow</button>
    <button id="withdraw" class="danger" hidden>Withdraw my consent</button>
  </div>
  <div class="actions" id="signin-actions" hidden><button id="signin">Sign in to continue</button></div>
</main>
<script nonce="{{.Nonce}}">
const cfg = {{.Config}};
const KEY = "matura.consent";
const $ = (id) => document.getElementById(id);
const redirectUri = location.origin + location.pathname;
let token = null, request = null;

function show(title, message, note) {
  $("title").textContent = title;
  $("message").textContent = message || "";
  $("note").textContent = note || "";
}
function b64url(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function signIn(clientId) {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  sessionStorage.setItem(KEY, JSON.stringify({ clientId, verifier, state }));
  const q = new URLSearchParams({ response_type: "code", client_id: cfg.client_id, redirect_uri: redirectUri,
    scope: "openid email profile", code_challenge: challenge, code_challenge_method: "S256", state });
  location.assign(cfg.issuer.replace(/\/$/, "") + "/protocol/openid-connect/auth?" + q);
}
async function api(method, path, body) {
  const init = { method, headers: { Authorization: "Bearer " + token } };
  if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  return fetch(path, init);
}
function render() {
  const a = request.agent;
  show("Allow " + a.name + " to act for you?", (a.description || "") ,
    a.consent === "required" ? "" : "Your organisation lets this agent act for its members without asking; you can still narrow or withdraw it here.");
  $("who").textContent = (a.kind === "agent" ? "AI agent" : "Service account") + " in " + request.tenant_name +
    (a.owner ? ", run by " + a.owner : "") + ".";
  const list = $("perms"); list.textContent = "";
  const current = request.current && request.current.permissions;
  let any = false;
  for (const app of request.apps) {
    for (const p of app.permissions) {
      any = true;
      const li = document.createElement("li");
      const box = document.createElement("input");
      box.type = "checkbox"; box.value = p; box.id = "p-" + app.app + "-" + p; box.checked = !current || current.includes(p);
      const label = document.createElement("label"); label.htmlFor = box.id;
      const code = document.createElement("code"); code.textContent = p === "*" ? "everything you can do" : p;
      label.append(code, document.createTextNode(" in " + app.name));
      li.append(box, label); list.append(li);
    }
  }
  if (!any) {
    const li = document.createElement("li"); li.textContent = "Nothing yet: the agent has no roles you share."; list.append(li);
  }
  $("details").hidden = false; $("actions").hidden = false;
  $("withdraw").hidden = !request.current;
}
async function load(clientId) {
  const res = await api("GET", "/v1/me/consent-request?client_id=" + encodeURIComponent(clientId));
  if (res.status === 404) return show("Agent not found", "It does not exist, or you are not a member of its organisation.");
  if (res.status === 401) { $("signin-actions").hidden = false; $("signin").onclick = () => signIn(clientId); return show("Sign in again"); }
  if (!res.ok) return show("Something went wrong", "Try again in a moment.");
  request = await res.json();
  render();
}
async function allow() {
  const boxes = [...document.querySelectorAll("#perms input[type=checkbox]")];
  const chosen = boxes.filter((b) => b.checked).map((b) => b.value);
  if (boxes.length && !chosen.length) return show("Choose at least one thing", "Or press Don't allow.");
  const body = { client_id: request.agent.client_id };
  if (boxes.length && chosen.length < boxes.length) body.permissions = chosen;
  const days = $("expiry").value;
  if (days) body.expires_at = new Date(Date.now() + Number(days) * 86400000).toISOString();
  const res = await api("POST", "/v1/me/consents", body);
  if (!res.ok) { const p = await res.json().catch(() => ({})); return show("Could not save", p.detail || "Try again."); }
  sessionStorage.removeItem(KEY);
  $("actions").hidden = true; $("details").hidden = true;
  show("Allowed", request.agent.name + " can now act for you within what you chose.",
    "Go back to the agent. You can withdraw this at any time from this page or your account.");
}
async function withdraw() {
  const res = await api("DELETE", "/v1/me/consents/" + request.current.id);
  if (!res.ok && res.status !== 404) return show("Could not withdraw", "Try again.");
  $("actions").hidden = true; $("details").hidden = true;
  show("Consent withdrawn", request.agent.name + " can no longer act for you. Tokens it already had stop working now.");
}
async function finish(params) {
  const saved = JSON.parse(sessionStorage.getItem(KEY) || "null");
  history.replaceState(null, "", redirectUri + (saved ? "?client_id=" + encodeURIComponent(saved.clientId) : ""));
  if (!saved || saved.state !== params.get("state")) return show("Sign-in did not complete", "Open the link from the agent again.");
  const res = await fetch(cfg.issuer.replace(/\/$/, "") + "/protocol/openid-connect/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ grant_type: "authorization_code", code: params.get("code"), client_id: cfg.client_id,
      redirect_uri: redirectUri, code_verifier: saved.verifier }),
  });
  if (!res.ok) return show("Sign-in did not complete", "Open the link from the agent again.");
  token = (await res.json()).access_token;
  $("allow").onclick = () => allow().catch(() => show("Something went wrong", "Try again."));
  $("deny").onclick = () => { sessionStorage.removeItem(KEY); $("actions").hidden = true; $("details").hidden = true;
    show("Not allowed", "The agent cannot act for you. You can close this page."); };
  $("withdraw").onclick = () => withdraw().catch(() => show("Something went wrong", "Try again."));
  await load(saved.clientId);
}

const params = new URLSearchParams(location.search);
if (!cfg.issuer || !cfg.client_id) show("Sign-in is not configured", "Ask your admin to finish setting up this server.");
else if (params.has("code")) finish(params).catch(() => show("Something went wrong", "Open the link from the agent again."));
else if (params.has("error")) show("Sign-in did not complete", "Open the link from the agent again.");
else if (params.has("client_id")) { show("An agent asks to act for you", "Sign in so we can show what it would be able to do.");
  $("signin-actions").hidden = false; $("signin").onclick = () => signIn(params.get("client_id")); }
else show("No agent named", "Open the consent link the agent gave you.");
</script>
</body>
</html>
