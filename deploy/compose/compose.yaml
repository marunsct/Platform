# Local evaluation stack: docker compose -f deploy/compose/compose.yaml up
#   maturad   http://localhost:8080   (MATURA_AUTH=dev: send X-Matura-Dev-User: <uuid>)
#   Keycloak  http://localhost:8180   (admin / admin; realm "matura")
#   Mailpit   http://localhost:8025   (every email maturad and Keycloak send)
#   OpenFGA   http://localhost:8081   (fine-grained permissions; preshared key below, development only)
name: matura
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres-dev
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  keycloak:
    build: { context: ../.., dockerfile: deploy/compose/keycloak.Dockerfile }
    command: ["start-dev", "--import-realm"]
    environment:
      MATURA_URL: http://maturad:8080
      MATURA_INTERNAL_TOKEN: &internal-token matura-internal-development-token-0001  # development only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ../../keycloak/realm:/opt/keycloak/data/import:ro
    ports: ["8180:8180"]
    depends_on:
      postgres: { condition: service_healthy }

  mailpit:                        # catches sign-up and invitation emails: http://localhost:8025
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  openfga-migrate:                # creates or upgrades OpenFGA's tables, then exits
    image: openfga/openfga:v1.22.0
    command: ["migrate"]
    environment: &openfga-db
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga-dev@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  openfga:                        # fine-grained permissions (TS11); remove it and MATURA_OPENFGA_URL to run without
    image: openfga/openfga:v1.22.0
    command: ["run"]
    environment:
      <<: *openfga-db
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: &openfga-key matura-openfga-development-key-0001  # development only
    ports: ["8081:8080"]
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }

  maturad:
    build: { context: ../.., dockerfile: Dockerfile }
    environment:
      MATURA_ENV: development
      MATURA_AUTH: dev            # switch to oidc once the realm's users exist; see docs/spec/02 §4
      MATURA_ISSUER: http://localhost:8180/realms/matura
      MATURA_JWKS_URL: http://keycloak:8180/realms/matura/protocol/openid-connect/certs
      MATURA_DATABASE_URL: postgres://matura_app:matura-app-dev@postgres:5432/matura?sslmode=disable
      MATURA_MIGRATE_DATABASE_URL: postgres://matura_owner:matura-owner-dev@postgres:5432/matura?sslmode=disable
      MATURA_KEK: bWF0dXJhLWRldmVsb3BtZW50LW9ubHkta2V5LTAwMDE=  # development only; production: openssl rand -base64 32
      MATURA_INTERNAL_TOKEN: *internal-token
      MATURA_PUBLIC_URL: http://localhost:8080        # invitation links point here
      MATURA_SMTP_ADDR: mailpit:1025                  # invitation emails land in Mailpit
      MATURA_SMTP_FROM: no-reply@matura.local
      MATURA_OPENFGA_URL: http://openfga:8080         # fine-grained permissions; unset: those endpoints answer 501
      MATURA_OPENFGA_TOKEN: *openfga-key
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      openfga: { condition: service_started }

volumes:
  pgdata:
