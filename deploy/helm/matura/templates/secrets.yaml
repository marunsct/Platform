{{- if not .Values.database.existingSecret }}
{{- if or (not .Values.database.url) (not .Values.database.migrateUrl) }}
{{- fail "set database.existingSecret, or database.url and database.migrateUrl" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matura.dbSecret" . }}
  labels: {{- include "matura.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
  migrateUrl: {{ .Values.database.migrateUrl | quote }}
---
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- if and (eq .Values.env "production") (not .Values.secrets.kek) }}
{{- fail "production needs secrets.existingSecret or secrets.kek (openssl rand -base64 32)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matura.secrets" . }}
  labels: {{- include "matura.labels" . | nindent 4 }}
type: Opaque
stringData:
  kek: {{ .Values.secrets.kek | quote }}
  internalToken: {{ .Values.secrets.internalToken | default (randAlphaNum 48) | quote }}
  keycloakClientSecret: {{ .Values.secrets.keycloakClientSecret | default (randAlphaNum 48) | quote }}
{{- end }}
